<svg xmlns="http://www.w3.org/2000/svg" width="760" height="66" viewBox="0 0 760 66" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Hongyu. Multimodal AI Engineer.</title>
  <desc id="desc">A simple blue introduction for Hongyu's GitHub profile.</desc>
  <style>
    .title { font-family: 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 23px; font-weight: 700; fill: #0078d7; }
    .cursor { fill: #0078d7; animation: blink 1.3s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }
    @media (prefers-color-scheme: dark) { .title, .cursor { fill: #58a6ff; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <text class="title" x="380" y="40" text-anchor="middle">Hi, I'm Hongyu. Multimodal AI Engineer.</text>
  <rect class="cursor" x="663" y="22" width="2" height="24" rx="1" />
</svg>
